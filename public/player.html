<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b1c">
<title>MBTV | المشغّل</title>
<style>
:root{color-scheme:dark;--bg:#090b1c;--panel:#191c36;--line:#343858;--muted:#b8bad0;--accent:#7838e8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#2c1854 0,transparent 45%),var(--bg);color:#f7f6ff;font:15px Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:18px}
main{width:min(100%,1000px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 70px #0008}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{font-size:22px;margin:0}p{color:var(--muted);line-height:1.7}
video{display:block;width:100%;max-height:72vh;background:#000;border-radius:12px;aspect-ratio:16/9}
#status{padding:10px 12px;background:#11152b;border:1px solid #383c5f;border-radius:9px;margin-top:12px;min-height:42px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a,button{font:inherit;color:white;background:#282c4b;border:1px solid #4b5075;border-radius:9px;padding:9px 13px;text-decoration:none;cursor:pointer}
button.primary{background:linear-gradient(100deg,#873cf0,#5723c2);border:0}
small{color:var(--muted)}
@media(max-width:600px){main{padding:12px}h1{font-size:18px}body{padding:8px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
<main>
<header><h1>📺 MBTV — مشغّل البث</h1><a href="/">العودة إلى اللوحة</a></header>
<video id="video" controls playsinline autoplay></video>
<div id="status" role="status" aria-live="polite">جارٍ تجهيز المشغّل…</div>
<div class="actions"><button id="retry" class="primary" type="button">إعادة المحاولة</button><button id="copy" type="button">نسخ رابط المصدر</button></div>
<p><small>يدعم HLS بصيغة M3U8، بما في ذلك قوائم المقاطع التي تستخدم امتدادات غير معتادة مثل PDF، بشرط أن تكون بيانات المقاطع فيديو متوافقة وأن يسمح الخادم بطلبات المتصفح (CORS).</small></p>
</main>
<script>
"use strict";
const video=document.getElementById("video");
const statusBox=document.getElementById("status");
const params=new URLSearchParams(location.search);
const source=params.get("src")||"";
let hls=null;
function status(message){statusBox.textContent=message}
function validSource(value){try{const u=new URL(value);return (u.protocol==="https:"||u.protocol==="http:")&&!u.username&&!u.password}catch{return false}}
function destroy(){if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute("src");video.load()}
function start(){
 destroy();
 if(!validSource(source)){status("رابط التشغيل غير صالح. افتح القناة من لوحة MBTV أو استخدم رابط HTTP/HTTPS صحيحاً.");return}
 const isHls=/\.m3u8?(?:$|[?#])/i.test(source);
 if(isHls&&window.Hls&&Hls.isSupported()){
   hls=new Hls({enableWorker:true,lowLatencyMode:false,backBufferLength:30});
   hls.on(Hls.Events.MEDIA_ATTACHED,()=>{hls.loadSource(source);status("تم ربط المشغّل. جارٍ تحميل قائمة HLS…")});
   hls.on(Hls.Events.MANIFEST_PARSED,()=>{status("تم تحميل قائمة HLS. اضغط تشغيل إذا لم يبدأ الفيديو تلقائياً.");video.play().catch(()=>{})});
   hls.on(Hls.Events.ERROR,(_,data)=>{
     if(!data.fatal){if(data.details==="fragLoadError"||data.details==="manifestLoadError")status("تعذّر تحميل جزء من البث. تحقق من صلاحية الرابط واتصال المصدر.");return}
     if(data.type===Hls.ErrorTypes.NETWORK_ERROR){status("فشل الاتصال بالبث. قد يكون الرابط منتهياً أو يمنع الخادم طلبات CORS/Referer.");hls.startLoad()}
     else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){status("خطأ في ترميز الوسائط؛ نحاول استعادة المشغّل…");hls.recoverMediaError()}
     else{status("تعذّر تشغيل هذا المصدر. افحص نوع بيانات المقاطع وتوافق الترميز.");destroy()}
   });
   hls.attachMedia(video);
 }else if(video.canPlayType("application/vnd.apple.mpegurl")){
   video.src=source;
   video.addEventListener("loadedmetadata",()=>status("تم تحميل بيانات البث."),{once:true});
   video.addEventListener("error",()=>status("تعذّر تشغيل البث. تحقق من الرابط وصلاحيات المصدر."),{once:true});
 }else{
   video.src=source;
   video.addEventListener("error",()=>status("تعذّر تشغيل الملف مباشرة. إذا كان HLS، استخدم رابط قائمة M3U8 وليس رابط مقطع منفرد."),{once:true});
   status(isHls?"المتصفح لا يدعم HLS الأصلي ولم يتم تحميل HLS.js.":"تم إرسال المصدر إلى مشغّل الفيديو.");
 }
}
document.getElementById("retry").addEventListener("click",start);
document.getElementById("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(source);status("تم نسخ رابط المصدر.")}catch{status("تعذّر النسخ من المتصفح.")}});
start();
</script>
</body>
</html>
