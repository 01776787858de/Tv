<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b1c"><title>MBTV | المشغّل</title>
<style>
:root{color-scheme:dark;--bg:#090b1c;--panel:#191c36;--line:#343858;--muted:#aeb1ca;--purple:#7838e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -20%,#2c1854 0,transparent 34%),var(--bg);color:#f7f6ff;font:15px Tahoma,Arial,sans-serif}
button,input{font:inherit}.hidden{display:none!important}.login{width:min(420px,calc(100% - 28px));margin:12vh auto;padding:26px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.form{display:grid;gap:12px}.field{width:100%;padding:12px;background:#282c4b;border:1px solid #4b5075;border-radius:9px;color:white}.primary,.btn{padding:11px 15px;border:0;border-radius:9px;color:white;cursor:pointer}.primary{background:linear-gradient(100deg,#873cf0,#5723c2);font-weight:bold}.btn{background:#252945;border:1px solid #424768}.muted{color:var(--muted)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(4%,calc((100% - 1500px)/2));border-bottom:1px solid #292d4b;position:sticky;top:0;background:#0c0e20ed;backdrop-filter:blur(12px);z-index:5}header strong{font-size:25px;color:#d9b5ff}
.wrap{max-width:1500px;margin:auto;padding:22px clamp(14px,3vw,38px)}.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,370px);gap:18px;align-items:start}.maincol{min-width:0}.playerbox{background:#05060c;border:1px solid #343858;border-radius:14px;overflow:hidden;margin-bottom:18px;box-shadow:0 12px 35px #0004}.media{position:relative;aspect-ratio:16/9;background:#000}.media video,.media iframe{display:block;width:100%;height:100%;border:0;background:#000;object-fit:contain}.now{padding:13px 16px;min-height:48px}.catalogbox{background:linear-gradient(145deg,#20233f,#15182f);border:1px solid #383c5f;border-radius:14px;padding:15px;min-width:0}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 14px}.tools input{flex:1;min-width:180px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:14px;padding-bottom:4px}.filters button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{background:linear-gradient(145deg,#20233f,#15182f);border:1px solid #383c5f;border-radius:12px;overflow:hidden;cursor:pointer;min-width:0;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:#9b61ef}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#11152b}.card b{display:block;padding:10px;overflow-wrap:anywhere}.empty{padding:20px;background:#11152b;border:1px dashed #454a70;border-radius:10px;color:var(--muted)}
@media(min-width:1250px){.grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}.media{max-height:72vh}}
@media(max-width:900px){.watch-layout{grid-template-columns:1fr}.catalogbox{order:2}.wrap{padding:14px}.media{max-height:65vh}}
@media(max-width:560px){header{padding:12px 14px;align-items:flex-start}header strong{font-size:21px}.wrap{padding:10px}.watch-layout{gap:10px}.playerbox{border-radius:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card b{font-size:13px;padding:8px}.tools input{min-width:100%}.login{margin:8vh auto}}
</style>
</head><body>
<div id="login" class="login"><h2>📺 MBTV | دخول المشترك</h2><p class="muted">أدخل بيانات الاشتراك التي استلمتها من الإدارة</p><form id="loginForm" class="form"><label>اسم المستخدم<input id="username" class="field" autocomplete="username" required></label><label>كلمة المرور<input id="password" class="field" type="password" autocomplete="current-password" required></label><button class="primary">تسجيل الدخول</button></form><p id="error" class="muted"></p></div>
<div id="app" class="hidden"><header><strong>▶ MBTV</strong><div><span id="account" class="muted"></span>　<button id="logout" class="btn">خروج</button></div></header>
<main class="wrap"><div class="watch-layout"><section class="maincol"><div class="playerbox"><div class="media"><video id="video" controls playsinline></video><iframe id="youtube" class="hidden" title="مشغل YouTube" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div id="now" class="now">اختر قناة أو فيلماً لبدء المشاهدة</div></div></section>
<section class="catalogbox"><div class="tools"><input id="search" class="field" placeholder="ابحث عن قناة أو فيلم..."><button id="all" class="btn">كل المحتوى</button></div><div id="filters" class="filters"></div><div id="catalog" class="grid"></div></section></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s);let items=[],hls=null,activeGroup="الكل";
async function api(url,opt={}){const r=await fetch(url,{...opt,credentials:"same-origin",headers:{"Content-Type":"application/json",...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"حدث خطأ");return d}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showApp(){ $("#login").classList.add("hidden");$("#app").classList.remove("hidden") }
async function load(){const me=await api("/api/member/me");$("#account").textContent=me.username+" · ينتهي "+new Date(me.expiresAt).toLocaleDateString("ar");const d=await api("/api/catalog");items=d.items;render()}
function render(){const groups=["الكل",...new Set(items.map(x=>x.group||"عام"))];$("#filters").innerHTML=groups.map(g=>'<button class="btn" data-group="'+esc(g)+'">'+esc(g)+'</button>').join("");document.querySelectorAll("[data-group]").forEach(b=>{b.onclick=()=>{activeGroup=b.dataset.group;renderList()}});renderList()}
function renderList(){const q=$("#search").value.trim().toLowerCase();const list=items.filter(x=>(activeGroup==="الكل"||(x.group||"عام")===activeGroup)&&x.name.toLowerCase().includes(q));$("#catalog").innerHTML=list.length?list.map(x=>'<article class="card" data-play="'+esc(x.id)+'"><img loading="lazy" src="'+esc(x.poster||"")+'" alt=""><b>'+esc(x.name)+'<small class="muted"> · '+esc(x.type==="live"?"مباشر":x.type==="movies"?"فيلم":x.type==="youtube"?"YouTube":"مسلسل")+'</small></b></article>').join(""):'<div class="empty">لا يوجد محتوى مطابق للبحث.</div>';document.querySelectorAll("[data-play]").forEach(c=>c.onclick=()=>play(items.find(x=>x.id===c.dataset.play)))}
function youtubeId(raw){try{const u=new URL(raw);let id="";if(u.hostname==="youtu.be")id=u.pathname.split("/").filter(Boolean)[0]||"";else if(["youtube.com","www.youtube.com","m.youtube.com","youtube-nocookie.com","www.youtube-nocookie.com"].includes(u.hostname)){if(u.pathname==="/watch")id=u.searchParams.get("v")||"";else if(/^\/(embed|shorts|live)\//.test(u.pathname))id=u.pathname.split("/")[2]||""}return /^[A-Za-z0-9_-]{11}$/.test(id)?id:null}catch{return null}}
function stopPlayers(){if(hls){hls.destroy();hls=null}const v=$("#video");v.pause();v.removeAttribute("src");v.load();$("#youtube").src="";$("#youtube").classList.add("hidden");v.classList.remove("hidden")}
function play(item){if(!item)return;stopPlayers();$("#now").textContent="يتم تشغيل: "+item.name;if(item.type==="youtube"){const id=youtubeId(item.url);if(!id){$("#now").textContent="رابط YouTube غير معروف. استخدم رابط فيديو عادي أو youtu.be.";return}$("#video").classList.add("hidden");$("#youtube").classList.remove("hidden");$("#youtube").src="https://www.youtube-nocookie.com/embed/"+id+"?rel=0";return}const video=$("#video");if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=item.url;video.play().catch(()=>{})}else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(item.url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}))}else{$("#now").textContent="هذا المتصفح لا يدعم صيغة البث لهذا الرابط."}}
$("#search").oninput=renderList;$("#all").onclick=()=>{activeGroup="الكل";$("#search").value="";render()};$("#loginForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/member/login",{method:"POST",body:JSON.stringify({username:$("#username").value,password:$("#password").value})});showApp();await load()}catch(err){$("#error").textContent=err.message}};$("#logout").onclick=async()=>{await api("/api/member/logout",{method:"POST"});location.reload()};
(async()=>{try{showApp();await load()}catch{}})();
</script></body></html>
