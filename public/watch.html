<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b1c"><title>MBTV | المشغّل</title>
<style>
:root{color-scheme:dark;--bg:#090b1c;--panel:#191c36;--line:#343858;--muted:#aeb1ca;--purple:#7838e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -20%,#2c1854 0,transparent 34%),var(--bg);color:#f7f6ff;font:15px Tahoma,Arial,sans-serif}
button,input{font:inherit}.hidden{display:none!important}.login{width:min(420px,calc(100% - 28px));margin:12vh auto;padding:26px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.form{display:grid;gap:12px}.field{width:100%;padding:12px;background:#282c4b;border:1px solid #4b5075;border-radius:9px;color:white}.primary,.btn{padding:11px 15px;border:0;border-radius:9px;color:white;cursor:pointer}.primary{background:linear-gradient(100deg,#873cf0,#5723c2);font-weight:bold}.btn{background:#252945;border:1px solid #424768}.muted{color:var(--muted)}header{display:flex;align-items:center;justify-content:space-between;padding:16px 4%;border-bottom:1px solid #292d4b}header strong{font-size:25px;color:#d9b5ff}.wrap{max-width:1400px;margin:auto;padding:18px 4%}.playerbox{background:#05060c;border:1px solid #343858;border-radius:14px;overflow:hidden;margin-bottom:18px}.playerbox video{display:block;width:100%;max-height:66vh;background:#000;aspect-ratio:16/9}.now{padding:12px 15px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.tools input{flex:1;min-width:180px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.filters button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.card{background:linear-gradient(145deg,#20233f,#15182f);border:1px solid #383c5f;border-radius:12px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#11152b}.card b{display:block;padding:10px;overflow-wrap:anywhere}.empty{padding:20px;background:#11152b;border:1px dashed #454a70;border-radius:10px;color:var(--muted)}
</style>
</head><body>
<div id="login" class="login"><h2>📺 MBTV | دخول المشترك</h2><p class="muted">أدخل بيانات الاشتراك التي استلمتها من الإدارة</p><form id="loginForm" class="form"><label>اسم المستخدم<input id="username" class="field" autocomplete="username" required></label><label>كلمة المرور<input id="password" class="field" type="password" autocomplete="current-password" required></label><button class="primary">تسجيل الدخول</button></form><p id="error" class="muted"></p></div>
<div id="app" class="hidden"><header><strong>▶ MBTV</strong><div><span id="account" class="muted"></span>　<button id="logout" class="btn">خروج</button></div></header>
<main class="wrap"><div class="playerbox"><video id="video" controls playsinline></video><div id="now" class="now">اختر قناة أو فيلماً لبدء المشاهدة</div></div>
<div class="tools"><input id="search" class="field" placeholder="ابحث عن قناة أو فيلم..."><button id="all" class="btn">كل المحتوى</button></div><div id="filters" class="filters"></div><div id="catalog" class="grid"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s);let items=[],hls=null,activeGroup="الكل";
async function api(url,opt={}){const r=await fetch(url,{...opt,credentials:"same-origin",headers:{"Content-Type":"application/json",...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"حدث خطأ");return d}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showApp(){ $("#login").classList.add("hidden");$("#app").classList.remove("hidden") }
async function load(){const me=await api("/api/member/me");$("#account").textContent=me.username+" · ينتهي "+new Date(me.expiresAt).toLocaleDateString("ar");const d=await api("/api/catalog");items=d.items;render()}
function render(){const groups=["الكل",...new Set(items.map(x=>x.group||"عام"))];$("#filters").innerHTML=groups.map(g=>'<button class="btn" data-group="'+esc(g)+'">'+esc(g)+'</button>').join("");document.querySelectorAll("[data-group]").forEach(b=>{b.onclick=()=>{activeGroup=b.dataset.group;renderList()}});renderList()}
function renderList(){const q=$("#search").value.trim().toLowerCase();const list=items.filter(x=>(activeGroup==="الكل"||(x.group||"عام")===activeGroup)&&x.name.toLowerCase().includes(q));$("#catalog").innerHTML=list.length?list.map(x=>'<article class="card" data-play="'+x.id+'"><img loading="lazy" src="'+esc(x.poster||"")+'" alt=""><b>'+esc(x.name)+'<small class="muted"> · '+esc(x.type==="live"?"مباشر":x.type==="movies"?"فيلم":"مسلسل")+'</small></b></article>').join(""):'<div class="empty">لا يوجد محتوى مطابق للبحث.</div>';document.querySelectorAll("[data-play]").forEach(c=>c.onclick=()=>play(items.find(x=>x.id===c.dataset.play)))}
function play(item){if(!item)return;const video=$("#video");if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute("src");video.load();$("#now").textContent="يتم تشغيل: "+item.name;if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=item.url;video.play().catch(()=>{})}else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(item.url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}))}else{$("#now").textContent="هذا المتصفح لا يدعم صيغة البث لهذا الرابط."}}
$("#search").oninput=renderList;$("#all").onclick=()=>{activeGroup="الكل";$("#search").value="";render()};$("#loginForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/member/login",{method:"POST",body:JSON.stringify({username:$("#username").value,password:$("#password").value})});showApp();await load()}catch(err){$("#error").textContent=err.message}};$("#logout").onclick=async()=>{await api("/api/member/logout",{method:"POST"});location.reload()};
(async()=>{try{showApp();await load()}catch{}})();
</script></body></html>
