services:
  - type: web
    name: mbtv-panel
    runtime: node
    plan: free
    region: frankfurt
    branch: mbtv-redesign
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mbtv-database
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PLAYLIST_KEY
        sync: false

databases:
  - name: mbtv-database
    plan: free
    region: frankfurt
    databaseName: mbtv_database
    user: mbtv_database_user
